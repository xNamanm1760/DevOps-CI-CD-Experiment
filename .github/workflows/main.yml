
name: DevOps CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build application
        run: python -m py_compile calculator.py

      - name: Run automated unit tests
        run: python -m unittest -v test_calculator.py

      - name: Deployment stage
        run: echo "Deployment stage completed successfully!"
